[project]
name = "joltik"
version = "0.1.0"
description = "Some shared libraries for other programs"
readme = "README.md"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyrefly>=1.0.0",
    "ruff>=0.14.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joltik"]
