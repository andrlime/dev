[project]
name = "blindify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "reportlab>=5.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
blindify = "blindify.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blindify"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyrefly>=1.0.0",
    "ruff>=0.14.4",
]
