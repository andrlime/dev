[project]
name = "alakazam-ui"
version = "0.1.0"
description = "macOS menu bar app for monitoring and triggering alakazam syncs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alakazam",
    "pyobjc-framework-cocoa>=10.3.1",
    "rumps>=0.4.0",
]

[project.scripts]
alakazam-ui = "alakazam_ui.app:main"

[tool.uv.sources]
alakazam = { path = "../alakazam", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alakazam_ui"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyrefly>=1.0.0",
    "ruff>=0.14.4",
]
