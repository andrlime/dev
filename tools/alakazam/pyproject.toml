[project]
name = "alakazam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
alakazam = "alakazam.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alakazam"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pyrefly>=1.0.0",
    "ruff>=0.14.4",
]
